project:
  type: website
  output-dir: _site
  pre-render: _export.py
  render:
    - "*.qmd"
    - "rungs/*.qmd"
  resources:
    - assets/
    - data/
    - figures/

website:
  title: "Word modes"
  site-url: https://wordmodes.antimaterie.ro
  favicon: assets/favicon.svg
  description: "Object-words and abstract-words leave different marks in language models: the same noun, used of one particular thing or in general, is placed differently by language models trained only on text."
  page-navigation: true
  bread-crumbs: false
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Argument
      - href: stages.qmd
        text: How it was built
      - href: method.qmd
        text: Method
      - text: Results
        menu:
          - rungs/e2.qmd
          - rungs/e3.qmd
          - rungs/e4.qmd
          - rungs/e5.qmd
          - rungs/e7.qmd
          - rungs/e6.qmd
          - rungs/e1.qmd
          - rungs/e8.qmd
          - text: "---"
          - stops.qmd
      - href: explorer.qmd
        text: Sentences
      - href: pairs.qmd
        text: Minimal pairs
      - href: data.qmd
        text: Data
    right:
      - icon: github
        href: https://github.com/aathanor/word-modes/tree/main/mode_probe
        aria-label: Code on GitHub
        text: Code
  page-footer:
    left: "Florin Cojocariu · 2026 · [code on GitHub](https://github.com/aathanor/word-modes/tree/main/mode_probe)"
    right: "Code MIT · data CC BY-SA 4.0 · text CC BY 4.0. Wikipedia sentences CC BY-SA 4.0; Gutenberg texts public domain."

format:
  html:
    theme: [default, styles.scss]
    toc: true
    toc-depth: 2
    html-math-method:
      method: katex
      url: /assets/vendor/katex/
    include-before-body: _banner.html
    include-after-body: _stamp.html
    anchor-sections: true
    smooth-scroll: false
    link-external-newwindow: true
    fig-responsive: true

execute:
  echo: false
  output: asis
  warning: false
  freeze: false
